<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
</head>
<body>
    <div class="form_register_container">
        <h2>Registro de Nuevo Usuario</h2>
        <form id="form_crear_usuario" action="#" method="POST">
            
            <!-- Datos Personales -->
            <div class="form-group">
                <label for="nombres">1. Nombres:</label>
                <input type="text" id="nombres" name="nombres" placeholder="Nombres" required>
            </div>

            <div class="form-group">
                <label for="apellidos">2. Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" placeholder="Apellidos" required>
            </div>

            <div class="form-group">
                <label for="fecha_nacimiento">3. Fecha de Nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>

            <div class="form-group">
                <label for="genero">4. Género:</label>
                <select id="genero" name="genero" required>
                    <option value="">Seleccione...</option>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                    <option value="O">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="estado_civil">5. Estado Civil:</label>
                <select id="estado_civil" name="estado_civil" required>
                    <option value="">Seleccione...</option>
                    <option value="soltero">Soltero/a</option>
                    <option value="casado">Casado/a</option>
                    <option value="divorciado">Divorciado/a</option>
                </select>
            </div>

            <!-- Datos de Contacto -->
            <div class="form-group">
                <label for="email">6. Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="telefono">7. Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="10 dígitos" required>
            </div>

            <div class="form-group">
                <label for="direccion">8. Dirección completa:</label>
                <input type="text" id="direccion" name="direccion" placeholder="Calle, Número, Colonia" required>
            </div>

            <!-- Datos de Sistema y Empresa -->
            <div class="form-group">
                <label for="rol">9. Rol del Usuario:</label>
                <select id="rol" name="rol" required>
                    <option value="">Seleccione...</option>
                    <option value="administrador">Administrador</option>
                    <option value="empleado">Empleado</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fecha_contratacion">10. Fecha de Contratación:</label>
                <input type="date" id="fecha_contratacion" name="fecha_contratacion" required>
            </div>

            <div class="form-group">
                <label for="nombre_usuario">11. Nombre de Usuario (Login):</label>
                <input type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Usuario para acceder" required>
            </div>

            <div class="form-group">
                <label for="password">12. Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Contraseña segura" required>
            </div>

            <!-- Datos Sensibles (Para encriptar con AES_ENCRYPT en Backend) -->
            <div class="form-group">
                <label for="curp">13. CURP / Número de Identidad:</label>
                <input type="text" id="curp" name="curp" placeholder="Identificador oficial" required>
            </div>

            <div class="form-group">
                <label for="cuenta_bancaria">14. Cuenta Bancaria:</label>
                <input type="text" id="cuenta_bancaria" name="cuenta_bancaria" placeholder="Clabe o número de cuenta" required>
            </div>

            <div class="form-group">
                <label for="salario">15. Salario Mensual:</label>
                <input type="number" id="salario" name="salario" step="0.01" placeholder="Ej. 15000.00" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Registrar Usuario</button>
            </div>
        </form>
    </div>
</body>
</html>
