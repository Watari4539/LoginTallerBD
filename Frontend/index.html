    <link rel="stylesheet" href="../styles.css">
    <script src="../main.js" defer></script>
</head>
<body class="auth-page">
    <main class="card auth-card">
        <p class="eyebrow">GESTIÓN DE USUARIOS</p>
        <h1>Iniciar sesión</h1>
        <p class="muted">Introduce tus credenciales para acceder al sistema.</p>
        <form class="login-form" action="../Backend/login.php" method="post">
            <div class="form-group">
                <label for="usuario">Nombre de usuario</label>
                <input type="text" name="usuario" id="usuario" placeholder="Tu usuario" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>
            </div>
            <button type="submit">Iniciar sesión</button>
        </form>
        <p class="auth-footer">¿No tienes cuenta? <a href="crearUsuario.php">Crear cuenta</a></p>
    </main>
