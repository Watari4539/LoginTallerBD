<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/main.js" defer></script>
</head>
<body>
    <div class="form_login">
        <form action="../Backend/login.php" method="POST">
            <input type="text" name="usuario" id="usuario" placeholder="usuario" autocomplete="username" required>
            <input type="password" name="password" id="password" placeholder="contraseña" autocomplete="current-password" required>
            <button type="submit">Iniciar sesión</button>
        </form>
        
        <div class="enlace_registro">
            <span>¿No tienes cuenta? <a href="crearUsuario.php">Crea una</a></span>
        </div>
    </div>
</body>
</html>
